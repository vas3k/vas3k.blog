name: Check build and Django configuration

on: [pull_request]

permissions:
  contents: read

jobs:
  dockerize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: touch .env
      - name: Build application
        run: docker compose build
      - name: Start database
        run: docker compose up -d postgres
      - name: Check migrations and Django configuration
        run: |
          docker compose run --rm club_app sh -ec '
            poetry run python3 utils/wait_for_postgres.py
            poetry run python3 manage.py migrate --noinput
            poetry run python3 manage.py check
            poetry run python3 manage.py makemigrations --check --dry-run
          '
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
