{% if block.posts %}
<section class="container{% if block.wide %} container-width-max{% endif %}">
    {% if block.title %}
        <div class="header-1">
            {% if block.url %}
                <a href="{{ block.url }}">{{ block.title }}</a>
            {% else %}
                {{ block.title }}
            {% endif %}
        </div>
    {% endif %}

    <div class="cards-group cards-group-{{ block.columns }}x">
        {% for post in block.posts %}
            {% include block.card_template %}
        {% endfor %}
    </div>
</section>
{% endif %}
